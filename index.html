<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Footballer Quiz</title>
</head>
<body>
  <main class="app">
    <header><div class="ball">⚽</div><div><p class="eyebrow">FOOTBALLER QUIZ</p><h1>Who’s the player?</h1></div></header>
    <section class="card hero">
      <div class="topline"><span id="mode">DEMO MODE</span><span id="score">100 PTS</span></div>
      <div class="clue-label">CLUE <span id="clueNo">1</span></div>
      <p id="clue" class="clue">Press Start Game to reveal your first clue.</p>
      <div id="feedback" class="feedback"></div>
      <input id="guess" autocomplete="off" autocapitalize="words" placeholder="Type a player's name…" disabled>
      <button id="guessBtn" class="primary" disabled>Guess Player</button>
      <button id="nextBtn" class="secondary">Start Game</button>
    </section>
    <section class="how"><strong>How it works</strong><p>Start with 100 points. Each wrong guess reveals another clue and reduces the available score.</p></section>
    <footer>Prototype • Live player data will be connected in the next phase.</footer>
  </main>
<script src="/app.js"></script>
</body>
</html>
